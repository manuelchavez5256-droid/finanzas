<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finanzas</title>
  <meta name="description" content="Control de ingresos, egresos y presupuesto mensual">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="encabezado">
    <h1 id="titulo">Resumen</h1>
    <button id="estado-sync" class="estado-sync" hidden></button>
  </header>

  <main id="vista" class="vista"></main>

  <button id="boton-agregar" class="boton-flotante" aria-label="Agregar movimiento">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="pestanas" aria-label="Secciones">
    <a href="#/resumen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      Resumen
    </a>
    <a href="#/movimientos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      Movimientos
    </a>
    <a href="#/ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      Ajustes
    </a>
  </nav>

  <!-- Formulario para agregar / editar un movimiento -->
  <dialog id="dialogo" class="dialogo">
    <form id="formulario" method="dialog">
      <h2 id="dialogo-titulo">Nuevo movimiento</h2>

      <div class="segmentado" role="radiogroup" aria-label="Tipo">
        <label><input type="radio" name="tipo" value="Egreso" checked><span>Egreso</span></label>
        <label><input type="radio" name="tipo" value="Ingreso"><span>Ingreso</span></label>
      </div>

      <label class="campo">Concepto
        <input name="concepto" list="lista-conceptos" required autocomplete="off" placeholder="Ej. Gasolina" autofocus>
        <datalist id="lista-conceptos"></datalist>
      </label>

      <div class="dos-columnas">
        <label class="campo">Monto real
          <input name="monto" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0">
        </label>
        <label class="campo">Presupuesto
          <input name="presupuesto" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0">
        </label>
      </div>

      <div class="dos-columnas">
        <label class="campo">Categoría
          <select name="categoria" required></select>
        </label>
        <label class="campo">Fecha
          <input name="fecha" type="date" required>
        </label>
      </div>

      <div class="acciones">
        <button type="button" id="boton-borrar" class="boton peligro">Borrar</button>
        <span class="espacio"></span>
        <button type="button" id="boton-cancelar" class="boton">Cancelar</button>
        <button type="submit" class="boton primario">Guardar</button>
      </div>
    </form>
  </dialog>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script src="vendor/chart.umd.js"></script>
  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
